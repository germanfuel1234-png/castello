services:
  mysql:
    image: mysql:8
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: castello
      MYSQL_DATABASE: castello
      MYSQL_USER: castello
      MYSQL_PASSWORD: castello
    ports:
      - "3307:3306"
    volumes:
      - castello-mysql-data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  castello-mysql-data:
